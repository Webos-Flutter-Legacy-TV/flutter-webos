# Builds every legacy-webos test app (normal and COMPAT_WEBOS4=1 packages)
# and checks them against webosbrew's firmware symbol data, so a change that
# would stop an app loading on some webOS release fails here, not on a TV.
#
#   - normal packages: every firmware image from webOS 5 on must pass
#   - COMPAT_WEBOS4=1: webOS 4.4 up to (not including) webOS 7 must pass
#
# make-compat-ipk.sh also runs tools/check-compat-ipk.py on each package
# (loader, DT_RPATH, NEEDED shims, preload patch, webOS 4 extras).
#
# Accepts the LG SDK License Agreement for the webOS NDK
# (WEBOS_NDK_ACCEPT_EULA=1), as docs-setup.yml does. No TV is involved.
name: Firmware compatibility

on:
  pull_request:
    paths:
      - "legacy-webos/**"
      - "lib/**"
      - "bin/**"
      - ".github/workflows/fw-compat.yml"
  schedule:
    - cron: "17 5 * * 3"   # Wednesdays 05:17 UTC: catches plugin changes on main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fw-compat-${{ github.ref }}
  cancel-in-progress: true

env:
  # webosbrew/dev-toolbox-cli release with the firmware symbol inventory
  FW_SYMBOLS_URL: https://github.com/webosbrew/dev-toolbox-cli/releases/download/v20261017-2d5a7b6/webosbrew-toolbox-fw-symbols_0.10.0-1_amd64.deb

jobs:
  check:
    name: Test apps vs. firmware symbol data
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs curl unzip xz-utils file pkg-config cmake ninja-build clang \
            libgtk-3-dev python3 python3-venv binutils

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Toolchains (setup.sh)
        working-directory: legacy-webos
        run: WEBOS_NDK_ACCEPT_EULA=1 ./setup.sh

      - name: Firmware symbol data
        run: |
          mkdir -p "$RUNNER_TEMP/fwsym"
          curl -fsSL "$FW_SYMBOLS_URL" -o "$RUNNER_TEMP/fwsym/fw-symbols.deb"
          dpkg-deb -x "$RUNNER_TEMP/fwsym/fw-symbols.deb" "$RUNNER_TEMP/fwsym/root"
          echo "FW_DB=$RUNNER_TEMP/fwsym/root/usr/share/webosbrew/compat-checker/data" >> "$GITHUB_ENV"
          ls "$RUNNER_TEMP/fwsym/root/usr/share/webosbrew/compat-checker/data"

      - name: Build and check
        working-directory: legacy-webos
        run: |
          . ./env.sh
          status=0
          for app in tests/*/; do
            name=$(basename "$app")
            for webos4 in 0 1; do
              echo "::group::$name (COMPAT_WEBOS4=$webos4)"
              (
                set -e
                cd "$app"
                COMPAT_WEBOS4=$webos4 flutter-webos build webos --release --legacy
                stage=$(echo build/webos-compat/release/stage/*)
                elfs=("$stage/$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["main"])' "$stage/appinfo.json")" "$stage"/lib/*.so)
                if [ "$webos4" = 1 ]; then
                  for f in libsystemd.so.0 libopus.so.0; do
                    [ -e "$stage/lib/compat/$f" ] && elfs+=("$stage/lib/compat/$f")
                  done
                  python3 "$OLDPWD/tools/fw-compat-check.py" --db "$FW_DB" --webos4 --require 4.4:7 "${elfs[@]}"
                else
                  python3 "$OLDPWD/tools/fw-compat-check.py" --db "$FW_DB" --require 5 "${elfs[@]}"
                fi
              ) || { echo "::error::$name (COMPAT_WEBOS4=$webos4) failed"; status=1; }
              echo "::endgroup::"
            done
          done
          exit $status
