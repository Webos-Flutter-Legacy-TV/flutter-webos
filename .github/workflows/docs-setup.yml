# Follows the website's Development guide from scratch in a clean Ubuntu
# container (https://webos-flutter-legacy-tv.github.io/development.html),
# so the documented setup can't silently drift from what actually works.
# Keep the commands here identical to the guide; the step names say which
# guide step each one is.
#
# A plain container on purpose: GitHub's runner images ship Node.js and many
# build tools, which would hide missing steps.
#
# Accepts the LG SDK License Agreement for the webOS NDK
# (WEBOS_NDK_ACCEPT_EULA=1), as the guide tells users to; decided by the
# organisation owner. No TV is involved.
name: "Docs: clean setup"

on:
  schedule:
    - cron: "43 4 * * 2"   # Tuesdays 04:43 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "legacy-webos/setup.sh"
      - "legacy-webos/env.sh"
      - "legacy-webos/tools/make-compat-ipk.sh"
      - "legacy-webos/tools/build-shims.sh"
      - "lib/commands/build.dart"
      - ".github/workflows/docs-setup.yml"

permissions:
  contents: read

jobs:
  guide:
    name: Development guide, steps 1-6
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: "Container prerequisites (not in the guide: the image has no git or certificates)"
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
          git config --global --add safe.directory '*'

      - name: "Step 2: clone (CI checks out this commit)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: webos-dev/flutter-webos

      - name: "Step 1: host packages"
        run: |
          apt-get update
          apt-get install -y git git-lfs curl unzip xz-utils file pkg-config cmake ninja-build clang \
            libgtk-3-dev python3 python3-venv openssh-client

      - name: "Step 1: Node.js 20+ via nvm"
        run: |
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
          . ~/.nvm/nvm.sh
          nvm install 22
          node --version
          echo "$(dirname "$(nvm which 22)")" >> "$GITHUB_PATH"

      - name: "Step 3: download toolchains"
        working-directory: webos-dev/flutter-webos/legacy-webos
        run: WEBOS_NDK_ACCEPT_EULA=1 ./setup.sh

      - name: "Step 5: check the setup"
        working-directory: webos-dev/flutter-webos/legacy-webos
        run: |
          . ./env.sh
          command -v flutter-webos ares-install patchelf
          ls compat/*/out/
          flutter-webos --version
          flutter-webos doctor -v | tee /tmp/doctor.txt
          grep -q '^\[✓\] Flutter' /tmp/doctor.txt || { echo "doctor: Flutter not ✓"; exit 1; }
          grep -q '^\[✓\] webOS toolchain' /tmp/doctor.txt || { echo "doctor: webOS toolchain not ✓"; exit 1; }

      - name: "Step 6: build a first app"
        working-directory: webos-dev
        run: |
          . flutter-webos/legacy-webos/env.sh
          flutter-webos create --platforms webos hello_tv
          cd hello_tv
          flutter-webos build webos --release --legacy
          ls -la build/webos/arm/release/ipk/com.flutter.app.hello-tv_1.0.0_arm.ipk
          ls -la build/webos-compat/release/com.flutter.app.hello-tv_1.0.0_arm.ipk

      - name: "Get started: webOS 4 package"
        working-directory: webos-dev/hello_tv
        run: |
          . ../flutter-webos/legacy-webos/env.sh
          COMPAT_WEBOS4=1 flutter-webos build webos --release --legacy
          ls build/webos-compat/release/stage/*/lib/compat/ | tee /tmp/compat.txt
          grep -qx libsystemd.so.0 /tmp/compat.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hello_tv-ipks
          path: |
            webos-dev/hello_tv/build/webos/arm/release/ipk/*.ipk
            webos-dev/hello_tv/build/webos-compat/release/*.ipk
          retention-days: 7
